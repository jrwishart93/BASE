<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Antecedents – B.A.S.E.</title>
<link rel="stylesheet" href="../../../styles/base.css">
<style>
  :root{
    --bg0:#040915; --bg1:#0b1732; --bg2:#0f1a32; --ink:#e9eefb;
    --cy:#5ff5f8; --cy2:#7aa2ff; --cy3:#9c73ff;
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12);
    --stroke:rgba(255,255,255,.16);
    --glow:rgba(122,162,255,.28);
    --muted:#b8c2da; --accent:#7aa2ff; --danger:#ff6b6b;
    --shadow:0 14px 32px rgba(4,12,32,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    --radius:20px; --radius-sm:14px;
    --warn-bg:rgba(255,107,107,0.14); --warn-bd:rgba(255,107,107,0.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 640px at 28% -8%, rgba(122,162,255,0.16) 0%, transparent 62%),
      radial-gradient(820px 620px at 96% 8%, rgba(95,245,248,0.12) 0%, transparent 64%),
      linear-gradient(180deg,var(--bg0),var(--bg1));
    font-size:16px;
    line-height:1.6;
    overflow:hidden; /* unlocked once form is open */
  }
  /* Intro */
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background:repeating-radial-gradient(circle at 32% 32%, rgba(255,255,255,.08) 0 1px, transparent 1px 2px);
    filter:blur(1px);z-index:2}
  #intro{position:fixed;inset:0;display:grid;place-items:center;z-index:3;padding:clamp(24px,6vw,48px)}
  .intro-card{
    width:min(520px,94vw);
    padding:clamp(28px,6vw,48px);
    border-radius:28px;
    border:1px solid var(--stroke);
    background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
    box-shadow:0 32px 60px rgba(4,12,32,.58), 0 0 42px rgba(122,162,255,.25);
    backdrop-filter:blur(16px) saturate(140%);
    text-align:center;
    display:flex;flex-direction:column;gap:24px;
    position:relative;
  }
  .intro-card::after{
    content:"";position:absolute;inset:-22%;background:radial-gradient(circle at 50% 30%, rgba(122,162,255,0.28), transparent 72%);
    filter:blur(14px);z-index:-1;
  }
  .intro-title{
    font-size:clamp(30px,7vw,44px);
    font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    background:linear-gradient(90deg,var(--cy),var(--cy2),var(--cy3));
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 18px rgba(122,162,255,.45);
    animation:intro-shimmer 9s ease infinite;
  }
  @keyframes intro-shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .intro-copy{color:rgba(233,238,251,.78);font-size:clamp(15px,2.4vw,17px);line-height:1.7}
  .intro-actions{display:flex;flex-direction:column;gap:16px;align-items:center}
  .primary-launch{
    display:inline-flex;align-items:center;justify-content:center;gap:12px;
    padding:14px 22px;border-radius:999px;border:1px solid rgba(122,162,255,.6);
    background:linear-gradient(160deg, rgba(122,162,255,.35), rgba(122,162,255,.12));
    color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;
    box-shadow:0 16px 40px rgba(4,12,32,.55), 0 0 24px rgba(122,162,255,.35);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .primary-launch:hover{transform:translateY(-2px);box-shadow:0 24px 48px rgba(4,12,32,.6),0 0 36px rgba(122,162,255,.45)}
  .primary-launch:disabled{
    cursor:progress;opacity:.65;transform:none;box-shadow:0 12px 26px rgba(4,12,32,.4);
  }
  .intro-loading{display:flex;align-items:center;gap:12px;color:rgba(233,238,251,.72);font-size:15px}
  .loading-spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(122,162,255,.25);border-top-color:var(--cy2);
    animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-out{animation:intro-fade .45s ease forwards}
  @keyframes intro-fade{to{opacity:0;transform:scale(.96)}}

  /* App shell */
  #app{opacity:0;pointer-events:none;transition:opacity .45s ease}
  #app.ready{opacity:1;pointer-events:auto}
  body.app-scroll{overflow:auto}
  header.app-head{
    position:sticky;top:0;z-index:40;
    padding:16px clamp(18px,4vw,28px);
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-left:max(clamp(18px,4vw,28px), env(safe-area-inset-left));
    padding-right:max(clamp(18px,4vw,28px), env(safe-area-inset-right));
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(180deg, rgba(20,26,42,0.86), rgba(20,26,42,0.58));
    backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke);
  }
  header.app-head h1{margin:0;font-size:clamp(1.05rem,2.4vw,1.35rem);letter-spacing:.26px}
  .wrap{
    display:grid;gap:clamp(18px,3vw,26px);
    grid-template-columns:minmax(0,1fr);
    max-width:1480px;margin:0 auto;
    padding:clamp(18px,3vw,28px);
  }
  @media (min-width:1180px){
    .wrap{grid-template-columns:minmax(0,1fr) minmax(320px,520px);}
  }
  .right{position:sticky;top:18px;align-self:flex-start;display:flex;flex-direction:column;gap:16px}
  .output{
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:clamp(16px,2.6vw,22px);min-width:0;
  }
  .output header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .output h3{margin:0;font-size:clamp(1rem,2.2vw,1.18rem)}
  .timestamp{color:var(--muted);font-size:13px}
  .warn-list{margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--warn-bd);background:var(--warn-bg);font-size:13px;line-height:1.5}
  .outbox{margin-top:12px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,0.34);padding:12px}
  textarea.readonly{
    width:100%;min-height:clamp(320px,60vh,640px);
    border:0;background:transparent;color:var(--ink);
    font-family:ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size:15px;line-height:1.65;letter-spacing:.18px;resize:vertical
  }
  .controls{display:flex;flex-direction:column;gap:12px}
  .btn{
    border:1px solid var(--stroke);
    background:var(--glass);
    padding:12px 16px;
    border-radius:14px;
    color:var(--ink);
    font-size:15px;
    line-height:1.2;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .2s ease, transform .2s ease;
    min-height:44px;
  }
  .btn:hover{background:var(--glass-2);transform:translateY(-1px)}
  .btn.primary{border-color:rgba(122,162,255,0.6)}
  .btn.danger{border-color:rgba(255,107,107,0.6)}
  .btn.small{padding:10px 14px;font-size:14px}

  /* Form layout */
  .form-shell{
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:clamp(18px,3vw,26px);
    display:flex;flex-direction:column;gap:28px;
  }
  fieldset{
    border:1px solid rgba(255,255,255,.14);
    border-radius:var(--radius-sm);
    padding:clamp(18px,2.6vw,26px);
    background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  }
  legend{
    padding:0 12px;
    font-weight:700;
    font-size:clamp(1rem,2.1vw,1.22rem);
    text-transform:uppercase;
    letter-spacing:.18em;
    color:rgba(233,238,251,.92);
  }
  .section-intro{margin-bottom:12px;color:rgba(233,238,251,.72);font-size:14px;line-height:1.6}
  .field-grid{
    display:grid;
    gap:18px;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  }
  .field-row{display:flex;flex-direction:column;gap:8px}
  .field-row.full{grid-column:1 / -1}
  label.field-label{font-weight:600;font-size:14px;line-height:1.35;display:flex;justify-content:space-between;gap:12px}
  .field-hint{font-weight:500;font-size:12px;color:rgba(233,238,251,.6)}
  input[type="text"],input[type="date"],input[type="email"],input[type="tel"],input[type="number"],select,textarea{
    width:100%;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.14);
    padding:12px 14px;
    background:rgba(4,12,32,.32);
    color:var(--ink);
    font-size:15px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  textarea{min-height:120px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:rgba(122,162,255,.65);box-shadow:0 0 0 2px rgba(122,162,255,.25)}
  .required-flag{
    font-size:12px;
    padding:2px 8px;
    border-radius:999px;
    background:rgba(255,107,107,0.22);
    border:1px solid rgba(255,107,107,0.45);
    color:#fff;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .warn-field{border-color:var(--warn-bd)!important;background:rgba(255,107,107,0.08)!important}

  .notes-area textarea{min-height:160px}

  @media (max-width:1100px){
    .wrap{grid-template-columns:1fr}
    .right{position:static}
    .controls{
      position:fixed;left:0;right:0;bottom:0;top:auto;
      padding:12px clamp(16px,5vw,28px) max(16px,env(safe-area-inset-bottom));
      background:linear-gradient(180deg, rgba(20,26,42,0.94), rgba(20,26,42,0.96));
      border-top:1px solid var(--stroke);
      flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px;z-index:60;
    }
    textarea.readonly{min-height:320px}
    body.app-scroll{padding-bottom:calc(120px + env(safe-area-inset-bottom));}
  }
  @media print{
    #intro,.grain,.controls,.btn{display:none!important}
    body{overflow:visible;background:#fff;color:#000}
    .wrap{grid-template-columns:1fr}
    .output{page-break-before:always}
    textarea.readonly{height:auto}
  }
</style>

<!-- INTRO -->
<div class="grain" aria-hidden="true"></div>
<div id="intro" aria-label="Antecedents intro">
  <article class="intro-card">
    <h1 class="intro-title">Antecedents</h1>
    <p class="intro-copy">
      Open the structured SPR-ready form to record identity, licensing, convictions, vehicle links,
      and any supporting notes in a single pass.
    </p>
    <div class="intro-actions">
      <button class="primary-launch" id="openFormBtn">Open Antecedents Form</button>
      <div class="intro-loading" id="introLoading" aria-live="polite" hidden>
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Preparing form&hellip;</span>
      </div>
    </div>
  </article>
</div>

<!-- APP -->
<div id="app" aria-hidden="true">
  <header class="app-head"><h1>Antecedents</h1></header>
  <div class="wrap">
    <div id="formRoot" aria-live="polite"></div>

    <div class="right">
      <aside class="output" aria-label="Antecedents text area">
        <header>
          <h3>Antecedents Text</h3>
          <span class="timestamp" id="timestamp">Last update: —</span>
        </header>
        <div id="warnings" class="warn-list" style="display:none"></div>
        <div class="outbox"><textarea id="outputBox" class="readonly" readonly></textarea></div>
      </aside>

      <nav class="controls" aria-label="Actions">
        <button class="btn small" id="markAllUnknownBtn">Mark all Unknown</button>
        <button class="btn small danger" id="resetBtn">Clear form</button>
        <button class="btn small primary" id="copyBtn">Copy text</button>
        <button class="btn small" id="exportBtn">Export .txt</button>
      </nav>
    </div>
  </div>

<script>
(function setupIntro(){
  const intro = document.getElementById('intro');
  const openBtn = document.getElementById('openFormBtn');
  const loading = document.getElementById('introLoading');
  const app = document.getElementById('app');
  if(!intro || !openBtn || !loading || !app) return;
  function showForm(){
    if(openBtn.disabled) return;
    openBtn.disabled = true;
    loading.hidden = false;
    setTimeout(()=>{
      intro.classList.add('fade-out');
      setTimeout(()=>{
        intro.style.display = 'none';
        document.body.classList.add('app-scroll');
        app.setAttribute('aria-hidden','false');
        app.classList.add('ready');
      }, 420);
    }, 220);
  }
  openBtn.addEventListener('click', showForm);
})();

const STORAGE_KEY = 'antecedents_form_v4';
const formRoot = document.getElementById('formRoot');
const outBox = document.getElementById('outputBox');
const tsEl = document.getElementById('timestamp');
const warnBox = document.getElementById('warnings');

const FORM_SECTIONS = [
  {
    id:'identity',
    legend:'Identity & Contact',
    intro:'Confirm who you are reporting on and how they can be contacted.',
    fields:[
      {id:'full_name', label:'Full name', type:'text', placeholder:'e.g. Jamie Walker'},
      {id:'dob', label:'Date of birth', type:'date'},
      {id:'age', label:'Age', type:'number', attrs:{min:'0'}, hint:'Leave blank if unknown.'},
      {id:'address', label:'Home address', type:'textarea', classes:['full'], placeholder:'Street, town, postcode'},
      {id:'contact_number', label:'Preferred contact number', type:'tel', placeholder:'e.g. 07700 900123'},
      {id:'email', label:'Email address', type:'email', placeholder:'e.g. name@example.com'},
      {id:'occupation', label:'Current occupation', type:'text', placeholder:'Role / employment status'},
      {id:'next_of_kin', label:'Emergency contact / next of kin', type:'text', classes:['full'], hint:'Record relationship and number where known.'}
    ]
  },
  {
    id:'licence',
    legend:'Licence Details',
    intro:'Capture the current licence position so the Procurator Fiscal can assess driving eligibility.',
    fields:[
      {id:'licence_held', label:'Licence held', type:'select', options:['Yes','No','Unknown'], default:'Unknown', requiredChoice:true},
      {id:'licence_status', label:'Licence status', type:'select', options:['Full licence','Provisional licence','Disqualified','Revoked','Not held','Unknown'], default:'Unknown'},
      {id:'licence_number', label:'Licence number', type:'text', placeholder:'e.g. WALKJ654321AB9CD'},
      {id:'issuing_authority', label:'Issuing authority', type:'text', placeholder:'e.g. DVLA Swansea'},
      {id:'expiry_date', label:'Licence expiry date', type:'date'},
      {id:'licence_points', label:'Live penalty points', type:'number', attrs:{min:'0'}, hint:'Use 0 if confirmed none are live.'}
    ]
  },
  {
    id:'convictions',
    legend:'Previous Convictions',
    intro:'Summarise known convictions, pending cases, and any live bail matters.',
    fields:[
      {id:'prev_convictions', label:'Previous convictions recorded', type:'select', options:['Yes','No','Unknown'], default:'Unknown', requiredChoice:true},
      {id:'convictions_details', label:'Previous convictions summary', type:'textarea', classes:['full'], hint:'Include offence types, courts and dates where relevant.'},
      {id:'pending_cases', label:'Pending cases', type:'select', options:['Yes','No','Unknown'], default:'Unknown', requiredChoice:true},
      {id:'pending_details', label:'Pending case summary', type:'textarea', classes:['full']},
      {id:'bail_status', label:'On bail at time of report', type:'select', options:['Yes','No','Unknown'], default:'Unknown', requiredChoice:true},
      {id:'bail_court', label:'Bail granted at', type:'text', placeholder:'Court and date'},
      {id:'bail_conditions', label:'Bail conditions / notes', type:'textarea', classes:['full']}
    ]
  },
  {
    id:'vehicle',
    legend:'Vehicle Connection',
    intro:'Explain any known link between the accused and a vehicle for this case.',
    fields:[
      {id:'vehicle_owner', label:'Vehicle ownership link', type:'select', options:['Own vehicle','Company vehicle','Borrowed vehicle','Hired vehicle','No vehicle connection','Unknown'], default:'Unknown'},
      {id:'registered_keeper', label:'Registered keeper', type:'text', placeholder:'Name / organisation'},
      {id:'vehicle_details', label:'Vehicle summary', type:'textarea', classes:['full'], hint:'Include make, model, registration and any relevant context.'},
      {id:'insurance_status', label:'Insurance status', type:'select', options:['Valid policy confirmed','Suspected uninsured','Policy status unknown'], default:'Policy status unknown'},
      {id:'insurance_details', label:'Insurance details', type:'textarea', classes:['full']}
    ]
  },
  {
    id:'notes',
    legend:'Notes',
    intro:'Add any narrative comments that should appear at the end of the antecedents section.',
    fields:[
      {id:'general_notes', label:'Additional notes', type:'textarea', classes:['full','notes-area'], hint:'Use this space for contextual remarks to support the PF.'}
    ]
  }
];

const FIELD_MAP = {};
const REQUIRED_CHOICE_FIELDS = [];
const SELECT_FIELDS = [];
const TEXT_FIELDS = [];
for(const section of FORM_SECTIONS){
  for(const field of section.fields){
    FIELD_MAP[field.id] = field;
    if(field.requiredChoice) REQUIRED_CHOICE_FIELDS.push(field.id);
    if(field.type === 'select') SELECT_FIELDS.push(field.id); else TEXT_FIELDS.push(field.id);
  }
}

function defaultState(){
  const base = {};
  for(const section of FORM_SECTIONS){
    for(const field of section.fields){
      if(field.type === 'select'){
        const options = field.options || [];
        const fallback = field.default ?? (options.includes('Unknown') ? 'Unknown' : (options[0] || ''));
        base[field.id] = fallback;
      }else{
        base[field.id] = field.default ?? '';
      }
    }
  }
  return base;
}

let state = (()=>{
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    for(const key in base){
      const field = FIELD_MAP[key];
      if(field && field.type === 'select'){
        const options = field.options || [];
        base[key] = options.includes(parsed?.[key]) ? parsed[key] : base[key];
      }else if(field){
        const value = parsed?.[key];
        base[key] = typeof value === 'string' ? value : (value == null ? base[key] : String(value));
      }
    }
    return base;
  }catch(_){
    return defaultState();
  }
})();

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(_){/* ignore */}
}

function getSelectValue(field, stored){
  const options = field.options || [];
  if(options.includes(stored)) return stored;
  return field.default ?? (options.includes('Unknown') ? 'Unknown' : (options[0] || ''));
}

function handleFieldChange(event){
  const target = event.target;
  if(!target || !target.name) return;
  state[target.name] = target.value;
  saveState();
  updateOutput();
}

function createField(field){
  const wrapper = document.createElement('div');
  wrapper.className = 'field-row';
  if(Array.isArray(field.classes)){
    for(const cls of field.classes){ wrapper.classList.add(cls); }
  }
  const inputId = `field-${field.id}`;
  const label = document.createElement('label');
  label.className = 'field-label';
  label.setAttribute('for', inputId);
  const labelText = document.createElement('span');
  labelText.textContent = field.label;
  label.appendChild(labelText);
  if(field.requiredChoice){
    const badge = document.createElement('span');
    badge.className = 'required-flag';
    badge.textContent = 'Yes/No required';
    label.appendChild(badge);
  }
  wrapper.appendChild(label);

  let control;
  if(field.type === 'textarea'){
    control = document.createElement('textarea');
  }else if(field.type === 'select'){
    control = document.createElement('select');
    for(const opt of field.options || []){
      const option = document.createElement('option');
      option.value = opt;
      option.textContent = opt;
      control.appendChild(option);
    }
  }else{
    control = document.createElement('input');
    control.type = field.type || 'text';
  }
  control.id = inputId;
  control.name = field.id;
  if(field.placeholder) control.placeholder = field.placeholder;
  if(field.attrs){
    for(const [key,value] of Object.entries(field.attrs)){
      control.setAttribute(key, value);
    }
  }
  const storedValue = state[field.id];
  if(field.type === 'select'){
    const value = getSelectValue(field, storedValue);
    state[field.id] = value;
    control.value = value;
    control.addEventListener('change', handleFieldChange);
  }else{
    const value = typeof storedValue === 'string' ? storedValue : (storedValue == null ? '' : String(storedValue));
    state[field.id] = value;
    control.value = value;
    control.addEventListener('input', handleFieldChange);
  }
  wrapper.appendChild(control);

  if(field.hint){
    const hint = document.createElement('div');
    hint.className = 'field-hint';
    hint.textContent = field.hint;
    wrapper.appendChild(hint);
  }
  return wrapper;
}

function renderForm(){
  if(!formRoot) return;
  formRoot.innerHTML = '';
  const form = document.createElement('form');
  form.className = 'form-shell';
  form.setAttribute('novalidate','');
  form.addEventListener('submit', (event)=>event.preventDefault());
  for(const section of FORM_SECTIONS){
    const fieldset = document.createElement('fieldset');
    fieldset.id = `section-${section.id}`;
    const legend = document.createElement('legend');
    legend.textContent = section.legend;
    fieldset.appendChild(legend);
    if(section.intro){
      const intro = document.createElement('p');
      intro.className = 'section-intro';
      intro.textContent = section.intro;
      fieldset.appendChild(intro);
    }
    const grid = document.createElement('div');
    grid.className = 'field-grid';
    for(const field of section.fields){
      grid.appendChild(createField(field));
    }
    fieldset.appendChild(grid);
    form.appendChild(fieldset);
  }
  formRoot.appendChild(form);
}

function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.position = 'fixed';
  t.style.bottom = '16px';
  t.style.right = '16px';
  t.style.background = 'rgba(4,12,32,0.85)';
  t.style.color = '#fff';
  t.style.padding = '10px 12px';
  t.style.borderRadius = '12px';
  t.style.border = '1px solid rgba(255,255,255,0.22)';
  t.style.fontSize = '13px';
  t.style.zIndex = '9999';
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 1800);
}

const ownerPhrases = {
  'Own vehicle':'The vehicle involved is owned by the accused.',
  'Company vehicle':'The vehicle involved is a company vehicle associated to the accused.',
  'Borrowed vehicle':'The accused was using a borrowed vehicle.',
  'Hired vehicle':'The accused was using a hired or rental vehicle.',
  'No vehicle connection':'No direct vehicle connection has been identified.',
  'Unknown':'Vehicle ownership connection remains unknown.'
};
const insurancePhrases = {
  'Valid policy confirmed':'A valid insurance policy has been confirmed for the relevant vehicle.',
  'Suspected uninsured':'The vehicle is suspected to be uninsured.',
  'Policy status unknown':'Insurance status remains unknown.'
};

const clean = (value)=>{
  if(value == null) return '';
  return typeof value === 'string' ? value.trim() : String(value).trim();
};

function formatSentence(value){
  const text = clean(value);
  if(!text) return '';
  return /[.!?]$/.test(text) ? text : `${text}.`;
}

function formatDate(value){
  const raw = clean(value);
  if(!raw) return '';
  const direct = new Date(raw);
  if(!Number.isNaN(direct.getTime())){
    return direct.toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
  }
  const fallback = new Date(`${raw}T00:00:00`);
  if(!Number.isNaN(fallback.getTime())){
    return fallback.toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'});
  }
  return raw;
}

function buildIdentitySection(){
  const sentences = [];
  const name = clean(state.full_name);
  const dob = clean(state.dob);
  const age = clean(state.age);
  if(name && dob){
    const dobText = formatDate(dob);
    const ageText = age ? ` (${age} years)` : '';
    sentences.push(`${name}, born ${dobText}${ageText}, is the subject of this report.`);
  }else if(name){
    sentences.push(`${name} is the subject of this report.`);
    if(age) sentences.push(`${name.split(' ')[0]} is recorded as ${age} years old.`);
    if(dob){
      const dobText = formatDate(dob);
      sentences.push(`Date of birth recorded as ${dobText}.`);
    }
  }else if(dob){
    const dobText = formatDate(dob);
    const ageText = age ? ` and is ${age} years old` : '';
    sentences.push(`The accused was born on ${dobText}${ageText}.`);
  }else if(age){
    sentences.push(`The accused's age is recorded as ${age} years, but full identity details remain outstanding.`);
  }else{
    sentences.push('No confirmed identity information was provided for the accused.');
  }
  const address = clean(state.address);
  sentences.push(address ? formatSentence(`Home address: ${address}`) : 'No home address has been confirmed.');
  const contact = clean(state.contact_number);
  const email = clean(state.email);
  if(contact && email){
    sentences.push(formatSentence(`Contact number ${contact} and email ${email} have been recorded`));
  }else if(contact){
    sentences.push(formatSentence(`Contact number recorded as ${contact}`));
  }else if(email){
    sentences.push(formatSentence(`Email contact recorded as ${email}`));
  }else{
    sentences.push('No direct contact details have been provided.');
  }
  const occupation = clean(state.occupation);
  sentences.push(occupation ? formatSentence(`Current occupation noted as ${occupation}`) : 'Current occupation has not been declared.');
  const nok = clean(state.next_of_kin);
  sentences.push(nok ? formatSentence(`Emergency contact / next of kin: ${nok}`) : 'No next of kin or emergency contact was supplied.');
  return sentences;
}

function buildLicenceSection(){
  const sentences = [];
  const held = state.licence_held || 'Unknown';
  if(held === 'Yes'){
    sentences.push('The accused confirms that a driving licence is currently held.');
  }else if(held === 'No'){
    sentences.push('The accused does not currently hold a driving licence.');
  }else{
    sentences.push('It remains unknown whether the accused currently holds a driving licence.');
  }
  const status = state.licence_status || 'Unknown';
  if(status && status !== 'Unknown'){
    sentences.push(formatSentence(`Licence status recorded as ${status.toLowerCase()}`));
  }
  const licenceNumber = clean(state.licence_number);
  sentences.push(licenceNumber ? formatSentence(`Licence number: ${licenceNumber}`) : 'Licence number not provided.');
  const issuing = clean(state.issuing_authority);
  if(issuing){
    sentences.push(formatSentence(`Issuing authority: ${issuing}`));
  }
  const expiry = clean(state.expiry_date);
  sentences.push(expiry ? formatSentence(`Licence expiry: ${formatDate(expiry)}`) : 'Licence expiry date not recorded.');
  const points = clean(state.licence_points);
  sentences.push(points ? formatSentence(`Current points endorsed: ${points}`) : 'No live penalty point information available.');
  return sentences;
}

function buildConvictionsSection(){
  const sentences = [];
  const prev = state.prev_convictions || 'Unknown';
  if(prev === 'Yes'){
    sentences.push('Previous convictions are held.');
  }else if(prev === 'No'){
    sentences.push('No previous convictions are recorded.');
  }else{
    sentences.push('It is not known whether previous convictions are held.');
  }
  const prevDetails = formatSentence(state.convictions_details);
  if(prevDetails) sentences.push(`Previous convictions summary: ${prevDetails}`);
  const pending = state.pending_cases || 'Unknown';
  if(pending === 'Yes'){
    sentences.push('There are pending cases against the accused.');
  }else if(pending === 'No'){
    sentences.push('No pending cases are known.');
  }else{
    sentences.push('It is not known whether any pending cases exist.');
  }
  const pendingDetails = formatSentence(state.pending_details);
  if(pendingDetails) sentences.push(`Pending case summary: ${pendingDetails}`);
  const bail = state.bail_status || 'Unknown';
  if(bail === 'Yes'){
    sentences.push('The accused was on bail at the time of reporting.');
  }else if(bail === 'No'){
    sentences.push('The accused was not on bail at the time of reporting.');
  }else{
    sentences.push('Bail status at the time of reporting is unknown.');
  }
  const bailCourt = clean(state.bail_court);
  const bailConditions = clean(state.bail_conditions);
  if(bailCourt) sentences.push(formatSentence(`Bail reference: ${bailCourt}`));
  if(bailConditions) sentences.push(formatSentence(`Bail conditions: ${bailConditions}`));
  return sentences;
}

function buildVehicleSection(){
  const sentences = [];
  const owner = state.vehicle_owner || 'Unknown';
  sentences.push(ownerPhrases[owner] || ownerPhrases.Unknown);
  const keeper = clean(state.registered_keeper);
  sentences.push(keeper ? formatSentence(`Registered keeper: ${keeper}`) : 'Registered keeper information has not been recorded.');
  const vehicleSummary = formatSentence(state.vehicle_details);
  if(vehicleSummary) sentences.push(`Vehicle summary: ${vehicleSummary}`);
  const insurance = state.insurance_status || 'Policy status unknown';
  sentences.push(insurancePhrases[insurance] || insurancePhrases['Policy status unknown']);
  const insuranceNotes = formatSentence(state.insurance_details);
  if(insuranceNotes) sentences.push(`Insurance notes: ${insuranceNotes}`);
  return sentences;
}

function buildNotesSection(){
  const notes = formatSentence(state.general_notes);
  return notes ? [notes] : ['No additional notes recorded.'];
}

function buildOutput(){
  const sections = [
    {heading:'IDENTITY & CONTACT', sentences:buildIdentitySection()},
    {heading:'LICENCE DETAILS', sentences:buildLicenceSection()},
    {heading:'PREVIOUS CONVICTIONS', sentences:buildConvictionsSection()},
    {heading:'VEHICLE CONNECTION', sentences:buildVehicleSection()},
    {heading:'NOTES', sentences:buildNotesSection()}
  ];
  const blocks = [];
  for(const section of sections){
    const sentences = section.sentences.filter(Boolean);
    blocks.push([section.heading, '', ...sentences].join('\n'));
  }
  return blocks.join('\n\n');
}

function updateWarnings(){
  if(!warnBox) return;
  const badIds = [];
  for(const id of REQUIRED_CHOICE_FIELDS){
    const choice = state[id] || 'Unknown';
    const isBad = choice !== 'Yes' && choice !== 'No';
    if(isBad) badIds.push(id);
    const control = document.getElementById(`field-${id}`);
    if(control){
      control.classList.toggle('warn-field', isBad);
    }
  }
  if(badIds.length){
    warnBox.style.display = 'block';
    const labels = badIds.map(id => FIELD_MAP[id]?.label || id);
    warnBox.innerHTML = '<strong>Action needed:</strong> record <em>Yes</em> or <em>No</em> for:<br>• ' + labels.join('<br>• ');
  }else{
    warnBox.style.display = 'none';
    warnBox.innerHTML = '';
  }
}

function updateOutput(){
  if(outBox){ outBox.value = buildOutput(); }
  if(tsEl){ tsEl.textContent = 'Last update: ' + new Date().toLocaleString(); }
  updateWarnings();
}

renderForm();
updateOutput();

const markAllUnknownBtn = document.getElementById('markAllUnknownBtn');
if(markAllUnknownBtn){
  markAllUnknownBtn.addEventListener('click', ()=>{
    for(const id of SELECT_FIELDS){
      const field = FIELD_MAP[id];
      const options = field.options || [];
      const fallback = options.includes('Unknown') ? 'Unknown' : (field.default ?? (options[0] || ''));
      state[id] = fallback;
      const control = document.getElementById(`field-${id}`);
      if(control) control.value = fallback;
    }
    for(const id of TEXT_FIELDS){
      state[id] = '';
      const control = document.getElementById(`field-${id}`);
      if(control) control.value = '';
    }
    saveState();
    updateOutput();
  });
}

const resetBtn = document.getElementById('resetBtn');
if(resetBtn){
  resetBtn.addEventListener('click', ()=>{
    if(!confirm('Clear the form and remove saved data?')) return;
    state = defaultState();
    saveState();
    renderForm();
    updateOutput();
  });
}

const copyBtn = document.getElementById('copyBtn');
if(copyBtn){
  copyBtn.addEventListener('click', async ()=>{
    if(!outBox) return;
    const text = outBox.value;
    try{
      await navigator.clipboard.writeText(text);
      toast('Text copied to clipboard.');
    }catch(_){
      outBox.select();
      document.execCommand('copy');
      toast('Text copied (fallback).');
    }
  });
}

const exportBtn = document.getElementById('exportBtn');
if(exportBtn){
  exportBtn.addEventListener('click', ()=>{
    if(!outBox) return;
    const blob = new Blob([outBox.value], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Antecedents.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
}
