  <main class="container recovery-page">
    <section class="card" aria-labelledby="seizure-log-title">
      <header class="section-header">
        <h1 id="seizure-log-title">Seizure Log</h1>
        <p class="fine-print">This log lists every recorded seizure entry. Update <code>data/seizure-log.json</code> to make changes.</p>
      </header>
      <div class="section-body">
        <div class="table-wrap table-wrapper">
          <table class="table" aria-describedby="seizure-log-title">
            <thead>
              <tr>
                <th scope="col">Date &amp; Time</th>
                <th scope="col">Incident</th>
                <th scope="col">Type</th>
                <th scope="col">Division</th>
                <th scope="col">Location</th>
                <th scope="col">Officers</th>
                <th scope="col">Details</th>
                <th scope="col">Remarks</th>
              </tr>
            </thead>
            <tbody id="seizure-log-body"></tbody>
          </table>
        </div>
        <p id="seizure-log-status" class="fine-print" hidden role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script type="module">
    const STATUS_MESSAGES = {
      empty: 'No seizures recorded yet. Add a new entry to data/seizure-log.json to populate the log.',
      error: 'Unable to load seizure log data. Please try again later.'
    };

    const tableBody = document.getElementById('seizure-log-body');
    const statusNode = document.getElementById('seizure-log-status');
    const dateFormatter = new Intl.DateTimeFormat('en-GB', {
      dateStyle: 'medium',
      timeStyle: 'short'
    });
    const currencyFormatter = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });

    function showStatus(messageKey) {
      if (!statusNode) return;
      statusNode.textContent = STATUS_MESSAGES[messageKey] || '';
      statusNode.hidden = !STATUS_MESSAGES[messageKey];
    }

    function formatDetails(record) {
      const details = record?.details || {};
      switch (record?.type) {
        case 'Vehicle':
          return [details.colour, details.make, details.model, details.vrm]
            .filter(Boolean)
            .join(' • ');
        case 'Drug':
          return [details.drugType, details.quantityOrWeight, valueLabel(details.estimatedValueGBP)]
            .filter(Boolean)
            .join(' • ');
        case 'Cash':
          return valueLabel(details.amountGBP);
        case 'Stolen Property':
        case 'Counterfeit Goods':
          return [details.description, quantityLabel(details.quantity), valueLabel(details.estimatedValueGBP)]
            .filter(Boolean)
            .join(' • ');
        default:
          return '';
      }
    }

    function quantityLabel(value) {
      if (value == null || value === '') return '';
      return `${value} item${Number(value) === 1 ? '' : 's'}`;
    }

    function valueLabel(value) {
      if (value == null || value === '') return '';
      const number = Number(value);
      if (Number.isNaN(number)) return '';
      return currencyFormatter.format(number);
    }

    function isRecordCandidate(value) {
      return value && typeof value === 'object' && !Array.isArray(value);
    }

    function normaliseSeizureLogPayload(payload) {
      if (Array.isArray(payload)) {
        return payload.filter(isRecordCandidate);
      }
      if (payload && typeof payload === 'object') {
        if (Array.isArray(payload.entries)) {
          return payload.entries.filter(isRecordCandidate);
        }
        if (Array.isArray(payload.records)) {
          return payload.records.filter(isRecordCandidate);
        }
      }
      return [];
    }

    async function loadSeizureLog() {
      try {
        const response = await fetch('./data/seizure-log.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data) && !(data && typeof data === 'object')) {
          throw new Error('Unexpected payload');
        }
        const records = normaliseSeizureLogPayload(data);
        if (!records.length) {
          showStatus('empty');
          return;
        }

        const rows = document.createDocumentFragment();
        records
          .slice()
          .sort((a, b) => {
            const aTime = Date.parse(a?.datetime || a?.updatedAt || 0);
            const bTime = Date.parse(b?.datetime || b?.updatedAt || 0);
            return Number.isNaN(bTime - aTime) ? 0 : bTime - aTime;
          })
          .forEach((record) => {
            const row = document.createElement('tr');

            const dtCell = document.createElement('td');
            const dt = Date.parse(record?.datetime || record?.updatedAt || '');
            dtCell.textContent = Number.isNaN(dt) ? '—' : dateFormatter.format(new Date(dt));
            row.appendChild(dtCell);

            const incidentCell = document.createElement('td');
            incidentCell.textContent = record?.incidentNumber || '—';
            row.appendChild(incidentCell);

            const typeCell = document.createElement('td');
            typeCell.textContent = record?.type || '—';
            row.appendChild(typeCell);

            const divisionCell = document.createElement('td');
            divisionCell.textContent = record?.division || '—';
            row.appendChild(divisionCell);

            const locationCell = document.createElement('td');
            locationCell.textContent = record?.location || '—';
            row.appendChild(locationCell);

            const officersCell = document.createElement('td');
            officersCell.textContent = Array.isArray(record?.officers) && record.officers.length
              ? record.officers.join(', ')
              : (record?.enquiryOfficer || '—');
            row.appendChild(officersCell);

            const detailsCell = document.createElement('td');
            const detailsText = formatDetails(record);
            detailsCell.textContent = detailsText || '—';
            row.appendChild(detailsCell);

            const remarksCell = document.createElement('td');
            remarksCell.textContent = record?.remarks || '—';
            row.appendChild(remarksCell);

            rows.appendChild(row);
          });

        tableBody.innerHTML = '';
        tableBody.appendChild(rows);
        showStatus();
      } catch (error) {
        console.error('Failed to load seizure log', error);
        showStatus('error');
      }
    }

    loadSeizureLog();
  </script>
